name: Update actions.lock

on:
  workflow_call:
    secrets:
      CLIENT_ID:
        required: true
      PRIVATE_KEY:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  path-filter:
    timeout-minutes: 5
    outputs:
      workflow-files: ${{ steps.changes.outputs.workflow-files }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            workflow-files:
              - '.github/workflows/**.yaml'
              - '.github/workflows/**.yml'
              - '.github/workflows/actions.lock'

  update-actions-lock:
    needs: path-filter
    if: needs.path-filter.outputs.workflow-files == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # gh actions-lock 拡張をインストール
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock

      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      # ロックファイルを生成・更新
      - name: Update actions.lock
        run: gh actions-lock
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # 差分チェック
      - name: Check diff
        id: diff
        run: |
          if git diff --quiet .github/workflows/actions.lock; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # 差分があれば PR ブランチにコミット & プッシュ
      - name: Commit and push
        if: steps.diff.outputs.changed == '1'
        uses: suzuki-shunsuke/commit-action@v1.1.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          commit_message: "chore: update actions.lock"
          files: |
            .github/workflows/actions.lock
            .github/workflows/*.yaml
            .github/workflows/*.yml
