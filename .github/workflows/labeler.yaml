name: Auto Label

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-labeler-${{ github.ref }} # デプロイしないため PR レベルの排他制御
  cancel-in-progress: false # PR の更新があった場合は前のジョブをキャンセルしない

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    uses: shimosyan/.github/.github/workflows/wc-labeler.yaml@d2c775546e84981c2b238f9a7fe69a7eae74cb37 # main
    secrets: inherit
