name: Auto Label

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-labeler-${{ github.ref }} # デプロイしないため PR レベルの排他制御
  cancel-in-progress: false # PR の更新があった場合は前のジョブをキャンセルしない

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    uses: shimosyan/.github/.github/workflows/wc-labeler.yaml@bc3ed1de3b27f64e0adef836c21a808ce44624fc # main
    secrets: inherit
