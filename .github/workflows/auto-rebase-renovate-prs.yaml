name: Auto Rebase Renovate PRs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - aqua.yaml
      - aqua-checksums.json
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Specific PR numbers to rebase (comma-separated, optional)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  rebase:
    uses: shimosyan/.github/.github/workflows/wc-auto-rebase-renovate-prs.yaml@bc3ed1de3b27f64e0adef836c21a808ce44624fc # main
    with:
      pr_numbers: ${{ inputs.pr_numbers }}
    secrets: inherit
