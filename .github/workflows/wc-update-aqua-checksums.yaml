name: Update aqua-checksums.json

on:
  workflow_call:
    secrets:
      CLIENT_ID:
        required: true
      PRIVATE_KEY:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  path-filter:
    # Get changed files to filter jobs
    timeout-minutes: 10
    outputs:
      test-files: ${{steps.changes.outputs.test-files}}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            test-files:
              - aqua.yaml

  update-aqua-checksums:
    needs: path-filter
    if: needs.path-filter.outputs.test-files == 'true'

    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1

      - name: Fix aqua-checksums.json
        run: aqua upc -prune

      - name: Check if aqua-checksums.json is changed
        id: diff
        run: |
          # git管理されていないファイルも含めて変更を検出
          if [ ! -f ./aqua-checksums.json ]; then
            # ファイルが存在しない場合は変更なしとみなす
            echo "changed=0" >> "$GITHUB_OUTPUT"
          elif ! git ls-files --error-unmatch ./aqua-checksums.json >/dev/null 2>&1; then
            # ファイルが存在するがgit管理されていない場合（新規作成）
            echo "changed=1" >> "$GITHUB_OUTPUT"
          elif git diff --exit-code ./aqua-checksums.json; then
            # 既存ファイルで変更なし
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            # 既存ファイルで変更あり
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - id: app-token
        if: steps.diff.outputs.changed == '1'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Commit and push
        if: steps.diff.outputs.changed == '1'
        uses: suzuki-shunsuke/commit-action@v1.1.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          commit_message: "update: aqua-checksums.json"
          files: aqua-checksums.json
